<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: bold; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; text-anchor: middle; }
      .badge-text { font-family: monospace; font-size: 11px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #22c55e; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-orange { stroke: #f59e0b; stroke-width: 2; fill: none; marker-end: url(#arrowhead-orange); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="700" class="bg" rx="16"/>
  <rect x="20" y="20" width="920" height="660" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="50" y="60" class="title">🛡️ ErrorHandler Architecture</text>
  <text x="50" y="85" class="subtitle">Custom Error Page Resolution with Dynamic Fallback Generation (Audit Resilient)</text>

  <!-- Input Trigger -->
  <g transform="translate(330, 110)">
    <rect width="300" height="50" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="150" y="26" class="node-text">ErrorHandler.handleError()</text>
    <text x="150" y="42" class="node-sub">serverConfig, statusCode (400, 403, 404, 405, 413, 500), message</text>
  </g>

  <line x1="480" y1="160" x2="480" y2="200" class="arrow"/>

  <!-- Step 1: Decision Custom Page in Config -->
  <g transform="translate(320, 200)">
    <polygon points="160 0, 320 40, 160 80, 0 40" fill="#4c1d95" stroke="#a855f7" stroke-width="1.5"/>
    <text x="160" y="36" class="node-text">Check error_pages Map</text>
    <text x="160" y="52" class="node-sub">serverConfig.getErrorPages().get("404")</text>
  </g>

  <!-- Left: Found in config -->
  <path d="M 320 240 L 220 300" class="arrow-green"/>
  <text x="240" y="265" class="badge-text" fill="#4ade80">Path Defined</text>

  <!-- Right: Not found in config -->
  <path d="M 640 240 L 740 300" class="arrow-orange"/>
  <text x="710" y="265" class="badge-text" fill="#facc15">No Custom Page</text>

  <!-- Custom Page Path Validation -->
  <g transform="translate(80, 300)">
    <rect width="280" height="120" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="140" y="28" class="node-text">Resolve Disk Path</text>
    <text x="140" y="48" class="badge-text">"./error_pages/404.html"</text>
    <text x="140" y="75" class="node-sub">• Check Files.exists(resolvedPath)</text>
    <text x="140" y="95" class="node-sub">• Read bytes: Files.readAllBytes()</text>
    <text x="140" y="110" class="node-sub">• Set Content-Type: text/html</text>
  </g>

  <!-- Custom File Exists vs Missing -->
  <path d="M 220 420 L 220 540" class="arrow-green"/>
  <text x="230" y="480" class="badge-text" fill="#4ade80">File Exists</text>

  <path d="M 360 360 L 600 360" class="arrow-orange"/>
  <text x="460" y="350" class="badge-text" fill="#facc15">File Missing (Fallback)</text>

  <!-- Fallback Default Generator -->
  <g transform="translate(600, 300)">
    <rect width="280" height="120" rx="8" fill="#854d0e" stroke="#facc15" stroke-width="1.5"/>
    <text x="140" y="28" class="node-text">generateDefaultErrorPage()</text>
    <text x="140" y="48" class="badge-text">Built-in HTML Fallback</text>
    <text x="140" y="75" class="node-sub">• Status text: HttpResponse.getStatusMessage()</text>
    <text x="140" y="95" class="node-sub">• Styled dark-mode HTML container</text>
    <text x="140" y="110" class="node-sub">• Embeds custom error explanation</text>
  </g>

  <path d="M 740 420 L 740 540" class="arrow"/>

  <!-- Final Response Outcomes -->
  <g transform="translate(80, 540)">
    <rect width="280" height="90" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="140" y="28" class="node-text" fill="#bbf7d0">⭐ Custom Error Response</text>
    <text x="140" y="50" class="node-sub">Returns branded 400, 403, 404, 500 HTML</text>
    <text x="140" y="70" class="badge-text" fill="#86efac">200 OK headers + Error Status Code</text>
  </g>

  <g transform="translate(600, 540)">
    <rect width="280" height="90" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="140" y="28" class="node-text" fill="#c7d2fe">🛡️ Safe Fallback Response</text>
    <text x="140" y="50" class="node-sub">Server never crashes even if disk file deleted</text>
    <text x="140" y="70" class="badge-text" fill="#a5b4fc">Guarantees 100% 42 Audit Compliance</text>
  </g>

</svg>

