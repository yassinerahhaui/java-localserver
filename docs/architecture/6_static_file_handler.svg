<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 760" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: bold; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; text-anchor: middle; }
      .badge-text { font-family: monospace; font-size: 11px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #22c55e; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #ef4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-cyan { stroke: #06b6d4; stroke-width: 2; fill: none; marker-end: url(#arrowhead-cyan); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
    <marker id="arrowhead-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06b6d4" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1020" height="760" class="bg" rx="16"/>
  <rect x="20" y="20" width="980" height="720" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="50" y="60" class="title">📂 StaticFileHandler Architecture (Day 3)</text>
  <text x="50" y="85" class="subtitle">Complete Request Flow: Security Traversal, MIME Type Resolution &amp; Dynamic Directory Listing</text>

  <!-- Step 1: Input Request -->
  <g transform="translate(390, 105)">
    <rect width="240" height="48" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="24" class="node-text">HttpRequest (GET /path)</text>
    <text x="120" y="38" class="node-sub">StaticFileHandler.handle(req, srv, route)</text>
  </g>

  <line x1="510" y1="153" x2="510" y2="185" class="arrow"/>

  <!-- Step 2: Route Security & Traversal Check -->
  <g transform="translate(350, 185)">
    <polygon points="160 0, 320 35, 160 70, 0 35" fill="#4c1d95" stroke="#a855f7" stroke-width="1.5"/>
    <text x="160" y="30" class="node-text">Path Traversal Check</text>
    <text x="160" y="46" class="node-sub">canonicalFile.startsWith(canonicalRoot)</text>
  </g>

  <!-- Traversal Attack Failed -> 403 -->
  <path d="M 670 220 L 780 220" class="arrow-red"/>
  <g transform="translate(780, 200)">
    <rect width="180" height="42" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="22" class="node-text" fill="#fca5a5">403 Forbidden</text>
    <text x="90" y="36" class="node-sub">Directory Traversal Blocked</text>
  </g>

  <!-- Safe Path -> Exists Check -->
  <line x1="510" y1="255" x2="510" y2="285" class="arrow-green"/>

  <!-- Step 3: Existence Check -->
  <g transform="translate(370, 285)">
    <polygon points="140 0, 280 32, 140 65, 0 32" fill="#155e75" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="28" class="node-text">canonicalFile.exists()</text>
    <text x="140" y="44" class="node-sub">Check file on disk</text>
  </g>

  <!-- Not found -> 404 -->
  <path d="M 650 317 L 780 317" class="arrow-red"/>
  <g transform="translate(780, 296)">
    <rect width="180" height="42" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="22" class="node-text" fill="#fca5a5">404 Not Found</text>
    <text x="90" y="36" class="node-sub">File does not exist</text>
  </g>

  <!-- Exists -> File or Directory? -->
  <line x1="510" y1="350" x2="510" y2="385" class="arrow-green"/>

  <!-- Step 4: File or Directory Decision -->
  <g transform="translate(380, 385)">
    <polygon points="130 0, 260 35, 130 70, 0 35" fill="#854d0e" stroke="#facc15" stroke-width="1.5"/>
    <text x="130" y="30" class="node-text">isDirectory() ?</text>
    <text x="130" y="46" class="node-sub">Folder or Regular File</text>
  </g>

  <!-- Branch Left: Regular File Flow -->
  <path d="M 380 420 L 220 470" class="arrow-cyan"/>
  <text x="280" y="435" class="badge-text" fill="#38bdf8">Regular File</text>

  <!-- Branch Right: Directory Flow -->
  <path d="M 640 420 L 780 470" class="arrow"/>
  <text x="730" y="435" class="badge-text" fill="#facc15">Directory</text>

  <!-- Left: File Serving Container -->
  <g transform="translate(60, 470)">
    <rect width="320" height="150" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="160" y="26" class="node-text">File Serving Pipeline</text>
    <text x="160" y="44" class="node-sub">1. Check file.canRead() (403 if not)</text>
    <text x="160" y="64" class="node-sub">2. Detect MIME type (html, css, png, js...)</text>
    <text x="160" y="84" class="node-sub">3. Read raw bytes: Files.readAllBytes()</text>
    <text x="160" y="104" class="node-sub">4. Set Content-Type &amp; Content-Length</text>
    
    <rect x="30" y="115" width="260" height="25" rx="4" fill="#14532d"/>
    <text x="160" y="132" class="badge-text" fill="#86efac">200 OK + File Bytes</text>
  </g>

  <!-- Right: Directory Resolution Container -->
  <g transform="translate(620, 470)">
    <rect width="340" height="150" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="170" y="26" class="node-text">Directory Inspection</text>
    <text x="170" y="46" class="node-sub">Check default_file ("index.html")</text>

    <!-- Sub decisions inside directory box -->
    <rect x="20" y="65" width="140" height="65" rx="6" fill="#14532d" stroke="#4ade80"/>
    <text x="90" y="85" class="node-text" fill="#bbf7d0">Index Exists</text>
    <text x="90" y="100" class="node-sub">Serve index.html</text>
    <text x="90" y="118" class="badge-text" fill="#4ade80">200 OK</text>

    <rect x="180" y="65" width="140" height="65" rx="6" fill="#451a03" stroke="#f59e0b"/>
    <text x="250" y="85" class="node-text" fill="#fde68a">No Index</text>
    <text x="250" y="100" class="node-sub">Check listing flag</text>
    <text x="250" y="118" class="badge-text" fill="#f59e0b">Listing Flag ?</text>
  </g>

  <!-- Directory Listing Outcomes -->
  <path d="M 770 620 L 640 665" class="arrow-green"/>
  <path d="M 870 620 L 920 665" class="arrow-red"/>

  <!-- Listing Enabled -->
  <g transform="translate(520, 665)">
    <rect width="250" height="50" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="125" y="24" class="node-text" fill="#bbf7d0">⭐ Dynamic HTML Directory Listing</text>
    <text x="125" y="40" class="node-sub">200 OK (Clean dark table with clickable links)</text>
  </g>

  <!-- Listing Disabled -->
  <g transform="translate(800, 665)">
    <rect width="180" height="50" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="24" class="node-text" fill="#fca5a5">403 Forbidden</text>
    <text x="90" y="40" class="node-sub">Directory listing disabled</text>
  </g>

</svg>

