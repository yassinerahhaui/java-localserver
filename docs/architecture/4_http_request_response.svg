<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: bold; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; text-anchor: middle; }
      .badge-text { font-family: monospace; font-size: 11px; font-weight: bold; fill: #38bdf8; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-blue { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-green { stroke: #4ade80; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ade80" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="980" height="720" class="bg" rx="16"/>
  <rect x="20" y="20" width="940" height="680" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="50" y="60" class="title">🔄 HttpRequest &amp; HttpResponse Models</text>
  <text x="50" y="85" class="subtitle">Inbound Request Parsing ➔ Server Pipeline ➔ Outbound HTTP/1.1 Wire Serialization</text>

  <!-- Left Container: HttpRequest Model -->
  <g transform="translate(50, 120)">
    <rect width="380" height="420" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="190" y="32" class="node-text" fill="#38bdf8">📥 HttpRequest (Inbound)</text>
    
    <rect x="20" y="55" width="340" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="78" class="badge-text">Request Line</text>
    <text x="35" y="98" class="node-sub" text-anchor="start">method: "GET" | uri: "/file.html?v=1" | path: "/file.html"</text>
    
    <rect x="20" y="130" width="340" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="153" class="badge-text">Headers Map (Case-Insensitive)</text>
    <text x="35" y="173" class="node-sub" text-anchor="start">Host, Content-Type, Transfer-Encoding, Cookie</text>

    <rect x="20" y="205" width="340" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="228" class="badge-text">Parsed Cookies &amp; Query Params</text>
    <text x="35" y="248" class="node-sub" text-anchor="start">cookies: {sessionId: "xyz"} | queryParams: {v: "1"}</text>

    <rect x="20" y="280" width="340" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="303" class="badge-text">Raw Body Storage</text>
    <text x="35" y="323" class="node-sub" text-anchor="start">byte[] body (Text, JSON, Binary file upload)</text>

    <rect x="20" y="355" width="340" height="45" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="380" class="node-sub" text-anchor="start">Helpers: isChunked(), getContentLength(), urlDecode()</text>
  </g>

  <!-- Middle Transition Pipeline -->
  <g transform="translate(445, 270)">
    <path d="M 0 40 L 80 40" class="arrow-blue"/>
    <rect x="10" y="0" width="70" height="30" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="45" y="18" class="node-sub" fill="#c7d2fe">Handlers</text>

    <path d="M 80 90 L 0 90" class="arrow-green"/>
    <rect x="10" y="100" width="70" height="30" rx="6" fill="#14532d" stroke="#4ade80"/>
    <text x="45" y="118" class="node-sub" fill="#86efac">Response</text>
  </g>

  <!-- Right Container: HttpResponse Model -->
  <g transform="translate(550, 120)">
    <rect width="380" height="420" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="190" y="32" class="node-text" fill="#4ade80">📤 HttpResponse (Outbound)</text>

    <rect x="20" y="55" width="340" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="78" class="badge-text" fill="#4ade80">Status Code &amp; Message</text>
    <text x="35" y="98" class="node-sub" text-anchor="start">statusCode: 200 | statusMessage: "OK" (RFC Lookup Map)</text>

    <rect x="20" y="130" width="340" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="153" class="badge-text" fill="#4ade80">Response Headers</text>
    <text x="35" y="173" class="node-sub" text-anchor="start">Content-Type, Content-Length, Location, Server</text>

    <rect x="20" y="205" width="340" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="228" class="badge-text" fill="#4ade80">Set-Cookie Support</text>
    <text x="35" y="248" class="node-sub" text-anchor="start">setCookie("session_id", "xyz", 3600, "/", false, true)</text>

    <rect x="20" y="280" width="340" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="303" class="badge-text" fill="#4ade80">Body Payload</text>
    <text x="35" y="323" class="node-sub" text-anchor="start">byte[] body (HTML, JSON, Images, binary stream)</text>

    <rect x="20" y="355" width="340" height="45" rx="6" fill="#14532d" stroke="#4ade80"/>
    <text x="170" y="380" class="node-text" fill="#bbf7d0">⭐ toBytes() Wire Serialization</text>
  </g>

  <!-- Bottom: Wire Serialization Details -->
  <g transform="translate(140, 565)">
    <rect width="700" height="105" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="350" y="26" class="node-text">RFC 7230 Wire Format Generated by toBytes():</text>
    <text x="40" y="52" class="badge-text" fill="#facc15">HTTP/1.1 200 OK\r\n</text>
    <text x="40" y="70" class="badge-text" fill="#38bdf8">Content-Type: text/html; charset=UTF-8\r\nContent-Length: 42\r\nSet-Cookie: session=123\r\n\r\n</text>
    <text x="40" y="90" class="badge-text" fill="#4ade80">&lt;html&gt;&lt;body&gt;&lt;h1&gt;Hello World!&lt;/h1&gt;&lt;/body&gt;&lt;/html&gt;</text>
  </g>

</svg>

