<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Not Found</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-width: 500px; }
        h1 { font-size: 4rem; margin: 0; color: #60a5fa; }
        h2 { font-size: 1.5rem; margin: 10px 0 20px; color: #e2e8f0; }
        p { color: #94a3b8; line-height: 1.5; }
        a { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #3b82f6; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        a:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>404</h1>
        <h2>Not Found</h2>
        <p>The requested URL was not found on this server.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
